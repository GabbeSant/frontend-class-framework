<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.C.U. - Centro de Controle Unificado</title>

  <!-- Bootstrap CSS 5.3.3 (PASSO 2) -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  
  <!-- Estilos Customizados (Sempre DEPOIS do Bootstrap para sobrescrevê-lo) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- PASSO 2: Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">C.C.U. - Painel Executivo</span>
    </div>
  </nav>

  <!-- PASSO 3 & 4: Grid Responsivo do Bootstrap -->
  <div class="container-fluid px-4">
    <div class="row">

      <!-- PASSO 3: Coluna Esquerda (Status e Alertas) -->
      <div class="col-12 col-lg-4 mb-4">
        
        <!-- Card 1: Status de Roteamento -->
        <div class="card bg-light shadow mb-4">
          <div class="card-header bg-primary text-white fw-bold">
            Status de Roteamento
          </div>
          <div class="card-body">
            <p class="card-text mb-1"><strong>OSPF:</strong> <span class="text-success">Sincronizado</span></p>
            <p class="card-text mb-0"><strong>BGP:</strong> <span class="text-success">Ativo</span></p>
          </div>
        </div>

        <!-- Card 2: Alertas Críticos -->
        <div class="card shadow">
          <div class="card-header bg-danger text-white fw-bold">
            Alertas Críticos
          </div>
          <div class="card-body">
            <p class="card-text text-muted mb-0">Nenhum pico de latência detectado nas últimas 24h.</p>
          </div>
        </div>

      </div>

      <!-- PASSO 4: Coluna Direita (Animação da Telemetria) -->
      <div class="col-12 col-lg-8 mb-4">
        <div class="card border-0 shadow-lg">
          <div class="card-header bg-secondary text-white fw-bold">
            Telemetria de Testes em Pista
          </div>
          <div class="card-body p-0">
            
            <!-- Cenário Animado da Ferrari -->
            <div id="cenario">
              <div class="sol">☀️</div>
              <div class="nuvens">☁️</div>
              <div class="arvores">
                <span>🌲</span>
                <span>🌳</span>
                <span>🌲</span>
              </div>
              <div class="estrada"></div>
              <div class="veiculo">🏎️</div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Script JS do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
